name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [v0.7.0, main]
    defaults:
      run:
        working-directory: actors
    steps:
      - uses: actions/checkout@v4
        with:
          path: actors
      # Keep the sibling path repository and test both supported releases and the next framework changes.
      - uses: actions/checkout@v4
        with:
          repository: crabphp/framework
          ref: ${{ matrix.framework }}
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, posix, sockets, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer format:check
      - run: composer lint
      - run: composer test
